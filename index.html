    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px 12px 48px; }
    .container { max-width: 1080px; margin: 0 auto; }

    header {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px; margin-bottom: 18px; display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center; gap: 14px;
    }
    .brand-tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.16);
      color: var(--gold);
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 3px 9px;
      border-radius: 6px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; letter-spacing: 0.02em; }
    .subtitle { color: var(--muted); font-size: 0.85rem; }

    .status-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pill {
      padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); font-size: 0.8rem; color: var(--muted);
    }
    .pill strong { color: var(--text); }

    button, select, input {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px; font-size: 0.9rem; outline: none;
    }
    button { background: var(--accent); border-color: var(--accent); font-weight: 600; cursor: pointer; }
    button:active { transform: scale(0.98); }

    .controls { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; margin-bottom: 18px; }
    @media (max-width: 680px) { .controls { grid-template-columns: 1fr; } }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }

    .item-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 15px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
      transition: background 0.15s ease;
    }
    .item-card:hover { background: var(--card-hover); }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .item-class { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .item-name { font-size: 1.02rem; font-weight: 700; }

    .badge { padding: 4px 8px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
    .badge.up { color: var(--up); background: var(--up-bg); }
    .badge.down { color: var(--down); background: var(--down-bg); }
    .badge.flat { color: var(--flat); background: var(--flat-bg); }

    .item-bottom {
      display: flex; justify-content: space-between; align-items: baseline;
      border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;
    }
    .value-label { font-size: 0.75rem; color: var(--muted); }
    .value-price { font-size: 1.3rem; font-weight: 800; color: #60a5fa; }
    .prev-price { font-size: 0.78rem; color: var(--muted); }
    .empty { grid-column: 1 / -1; text-align: center; padding: 36px; color: var(--muted); border: 1px dashed var(--border); border-radius: 14px; }

    function parseNumberValue(str) {
      if (!str) return 0;
      const clean = str.replace(/,/g, "").trim().toUpperCase();
      if (clean.endsWith("K")) return parseFloat(clean) * 1000;
      if (clean.endsWith("M")) return parseFloat(clean) * 1000000;
      return parseFloat(clean) || 0;
    }

    function parseSiteHTML(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const parsed = [];
      const seen = new Set();

      doc.querySelectorAll("div, article, section").forEach((el) => {
        const text = el.innerText || "";
        if (!text.includes("VALUE") || !text.includes("DEMAND") || text.length > 350) return;

        const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
        const valIdx = lines.findIndex(l => l.toUpperCase() === "VALUE");
        if (valIdx === -1 || !lines[valIdx + 1]) return;

        const rawValue = lines[valIdx + 1];
        const numValue = parseNumberValue(rawValue);
        if (numValue <= 0) return;

        let className = "OTHER";
        const knownClasses = ["ASCENDED", "SPECIAL GRADE", "ANNIVERSARY", "MYTHIC", "LEGENDARY", "EPIC"];
        for (const c of knownClasses) {
          if (lines.some(l => l.toUpperCase().includes(c))) {
            className = c;
            break;
          }
        }

        let name = "";
        for (let i = valIdx - 1; i >= 0; i--) {
          const candidate = lines[i];
          if (!knownClasses.includes(candidate.toUpperCase()) && candidate.length > 2) {
            name = candidate;
            break;
          }
        }

        if (name && !seen.has(name)) {
          seen.add(name);
          parsed.push({ name, className, rawValue, numValue });
        }
      });

      return parsed;
    }

    // Запрос с жёстким тайм-аутом 3 секунды, чтобы сайт НИКОГДА не зависал
    async function fetchWithTimeout(url, ms = 3000) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        clearTimeout(id);
        return res;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    async function fetchFromSorcererValues() {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_URL)}`;
      try {
        const res = await fetchWithTimeout(proxyUrl, 3000);
        if (!res.ok) return null;
        const json = await res.json();
        const items = parseSiteHTML(json.contents || "");
        return items.length >= 5 ? items : null;
      } catch {
        return null;
      }
    }

    async function syncValues() {
      sourceEl.textContent = "Проверка обновлений...";
      const liveItems = await fetchFromSorcererValues();

      const now = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      if (liveItems) {
        units = liveItems.map((item) => {
          const prev = units.find(u => u.name === item.name);
          const prevNum = prev ? prev.numValue : item.numValue;
          const prevRaw = prev ? prev.rawValue : item.rawValue;
          let trend = prev ? prev.trend : "FLAT";
          if (item.numValue > prevNum) trend = "UP";
          else if (item.numValue < prevNum) trend = "DOWN";
          return { ...item, prevRaw, trend };
        });
        sourceEl.textContent = `Live-обновление (${now})`;
      } else {
        sourceEl.textContent = `База STD активна (${now})`;
      }

      countdown = REFRESH_SECONDS;
      render();
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const cls = classEl.value;
      const trd = trendEl.value;

      const filtered = units.filter((u) => {
        const matchName = u.name.toLowerCase().includes(q);
        const matchClass = cls === "ALL" || u.className === cls;
        const matchTrend = trd === "ALL" || u.trend === trd;
        return matchName && matchClass && matchTrend;
      });

      if (!filtered.length) {
        gridEl.innerHTML = `<div class="empty">Юниты не найдены.</div>`;
        return;
      }

      gridEl.innerHTML = filtered.map((u) => {
        let badgeClass = "flat";
        let badgeText = "— Без изменений";
        if (u.trend === "UP") {
          badgeClass = "up";
          badgeText = "▲ Поднялась";
        } else if (u.trend === "DOWN") {
          badgeClass = "down";
          badgeText = "▼ Упала";
        }

        return `
          <article class="item-card">
            <div class="item-top">
              <div>
                <div class="item-class">${u.className}</div>
                <div class="item-name">${u.name}</div>
              </div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="item-bottom">
              <div>
                <div class="value-label">Стоимость (STD)</div>
                <div class="value-price">${u.rawValue}</div>
              </div>
              <div class="prev-price">Было: ${u.prevRaw}</div>
            </div>
          </article>
        `;
      }).join("");
    }

    searchEl.addEventListener("input", render);
    classEl.addEventListener("change", render);
    trendEl.addEventListener("change", render);
    refreshBtn.addEventListener("click", syncValues);

    // Сразу рисуем карточки без ожидания сети
    render();
    syncValues();

    setInterval(() => {
      countdown -= 1;
      if (countdown <= 0) {
        syncValues();
      } else {
        countdownEl.textContent = String(countdown);
      }
    }, 1000);
